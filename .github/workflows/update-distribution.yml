name: Update Distribution Assets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'
  push:
    branches:
      - gh-pages
    paths:
      - '.github/workflows/update-distribution.yml'
      - 'scripts/generate-distribution.sh'
      - 'scripts/prepare-upstream-source.mjs'
      - 'scripts/validate-distribution.mjs'
      - 'webpack.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'src/**'
      - 'public/**'

permissions:
  contents: write

concurrency:
  group: update-distribution-assets
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: myjian/mai-tools
  UPSTREAM_REF: gh-pages
  MAI_TOOLS_ALLOWED_ORIGIN: https://hvboq.github.io
  MAI_TOOLS_HOSTED_BASE_URL: https://hvboq.github.io/mai-tools

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out distribution repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: distribution

      - name: Check out upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream-source

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: upstream-source/package-lock.json

      - name: Prepare upstream source
        working-directory: distribution
        run: node scripts/prepare-upstream-source.mjs "$GITHUB_WORKSPACE/upstream-source"

      - name: Install dependencies
        working-directory: upstream-source
        run: npm ci

      - name: Audit dependencies
        working-directory: upstream-source
        run: npm audit --audit-level=critical

      - name: Build upstream bundle
        working-directory: upstream-source
        run: npm run build

      - name: Generate userscript and extension artifacts
        working-directory: distribution
        run: MAI_TOOLS_SOURCE_DIR="$GITHUB_WORKSPACE/upstream-source" MAI_TOOLS_BUILD_DIR="$GITHUB_WORKSPACE/upstream-source/build" ./scripts/generate-distribution.sh

      - name: Validate distribution artifacts
        working-directory: distribution
        run: MAI_TOOLS_BUILD_DIR="$GITHUB_WORKSPACE/upstream-source/build" node scripts/validate-distribution.mjs

      - name: Commit updated artifacts
        working-directory: distribution
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No distribution changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install-mai-tools.meta.js install-mai-tools.user.js scripts/prepare-upstream-source.mjs extensions/chrome extensions/firefox extensions/samsung-internet mai-tools-chrome-extension.zip mai-tools-firefox-extension.zip mai-tools-samsung-internet-extension.zip
          UPSTREAM_SHA=$(git -C "$GITHUB_WORKSPACE/upstream-source" rev-parse --short HEAD)
          git commit -m "chore: update distribution assets from upstream $UPSTREAM_SHA"
          git push
